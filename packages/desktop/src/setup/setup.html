<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Patch</title>
    <!--
      The first setup step (spec/05 § Desktop first run): where agents run. It is
      the shell's own page because there is no server to load anything from
      until it is answered. The steps after it are the app's own welcome route.
      Opened as setup.html#move, it first asks to move the app to Applications.
      Same colours and type as the app, so the hand-over is seamless.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f0ea;
        --card: #ffffff;
        --ink: #1b1813;
        --ink-3: #645c50;
        --line: #ddd6c6;
        --accent: #46802f;
        --accent-strong: #356026;
        --accent-tint: #e7f0dd;
        --on-accent: #ffffff;
        --danger: #b4462f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191817;
          --card: #2d2b28;
          --ink: #efede9;
          --ink-3: #928d84;
          --line: #4a463f;
          --accent: #77a966;
          --accent-strong: #8fbf7d;
          --accent-tint: #2b3726;
          --on-accent: #10140e;
          --danger: #e07a62;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.45 'Figtree',
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        -webkit-app-region: drag;
      }
      main {
        width: min(440px, 88vw);
        display: grid;
        gap: 20px;
        -webkit-app-region: no-drag;
      }
      .dots {
        display: flex;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .dots li {
        width: 24px;
        height: 4px;
        border-radius: 2px;
        background: var(--line);
      }
      .dots li:first-child {
        background: var(--accent);
      }
      h1 {
        margin: 0;
        font:
          500 30px/1.15 'Fraunces',
          Georgia,
          serif;
      }
      .choices {
        display: grid;
        gap: 10px;
      }
      button,
      textarea {
        font: inherit;
        color: inherit;
      }
      .choice {
        display: grid;
        gap: 2px;
        text-align: left;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        cursor: pointer;
      }
      .choice:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .choice-title {
        font-size: 16px;
        font-weight: 600;
      }
      .choice-hint {
        font-size: 14px;
        color: var(--ink-3);
      }
      label {
        font-size: 14px;
        color: var(--ink-3);
      }
      textarea {
        width: 100%;
        min-height: 96px;
        resize: vertical;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        font:
          14px/1.4 ui-monospace,
          'JetBrains Mono',
          monospace;
      }
      form {
        display: grid;
        gap: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 4px;
      }
      .primary {
        font-size: 16px;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 10px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--on-accent);
        cursor: pointer;
      }
      .primary:hover:not(:disabled) {
        background: var(--accent-strong);
      }
      .ghost {
        font-size: 14px;
        padding: 8px 10px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--ink-3);
        cursor: pointer;
      }
      button:disabled,
      textarea:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      #status {
        margin: 0;
        min-height: 1.45em;
        font-size: 14px;
        color: var(--ink-3);
      }
      #error {
        margin: 0;
        font-size: 14px;
        color: var(--danger);
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="move" hidden data-testid="move">
        <h1>Move Patch to Applications?</h1>
        <div class="row" style="margin-top: 20px">
          <button type="button" class="primary" id="move-yes" data-testid="move-yes">Move</button>
          <button type="button" class="ghost" id="move-no" data-testid="move-no">Not now</button>
        </div>
      </div>
      <div id="choose">
        <h1>Where should your agents run?</h1>
        <div class="choices" style="margin-top: 20px">
          <button type="button" class="choice" id="local" data-testid="choose-local">
            <span class="choice-title">This computer</span>
            <span class="choice-hint">Your phone reaches it from anywhere</span>
          </button>
          <button type="button" class="choice" id="remote" data-testid="choose-remote">
            <span class="choice-title">My own server</span>
            <span class="choice-hint">Paste the pairing code it printed</span>
          </button>
        </div>
      </div>
      <form id="join" hidden data-testid="join-form">
        <h1>Connect to your server</h1>
        <label for="code">Pairing code</label>
        <textarea
          id="code"
          data-testid="pairing-code"
          spellcheck="false"
          autocomplete="off"
          placeholder="patch-pair://…"
        ></textarea>
        <div class="row">
          <button type="submit" class="primary" id="connect" data-testid="connect">Connect</button>
          <button type="button" class="ghost" id="back" data-testid="back">Back</button>
        </div>
      </form>
      <p id="status" role="status" data-testid="status"></p>
      <p id="error" role="alert" data-testid="error" hidden></p>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const move = $('move');
      const choose = $('choose');
      const join = $('join');
      const status = $('status');
      const error = $('error');
      const buttons = () => [...document.querySelectorAll('button, textarea')];

      function busy(on) {
        for (const el of buttons()) el.disabled = on;
      }
      function say(message) {
        status.textContent = message;
      }
      function fail(message) {
        busy(false);
        say('');
        error.hidden = false;
        error.textContent = message;
      }
      function pick(choice) {
        error.hidden = true;
        busy(true);
        window.patchSetup.choose(choice);
      }

      if (location.hash === '#move') {
        choose.hidden = true;
        move.hidden = false;
      }
      $('move-yes').addEventListener('click', () => {
        error.hidden = true;
        busy(true);
        say('Moving…');
        window.patchSetup.move(true);
      });
      $('move-no').addEventListener('click', () => {
        error.hidden = true;
        move.hidden = true;
        choose.hidden = false;
        window.patchSetup.move(false);
      });

      $('local').addEventListener('click', () => pick({ kind: 'local' }));
      $('remote').addEventListener('click', () => {
        error.hidden = true;
        choose.hidden = true;
        join.hidden = false;
        $('code').focus();
      });
      $('back').addEventListener('click', () => {
        error.hidden = true;
        join.hidden = true;
        choose.hidden = false;
      });
      join.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = $('code').value.trim();
        if (input === '') return fail('Paste the pairing code your server printed.');
        pick({ kind: 'remote', input });
      });

      window.patchSetup.onProgress(say);
      window.patchSetup.onFail(fail);
    </script>
  </body>
</html>
