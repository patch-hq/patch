appId: io.github.tomchambers2.patch
productName: Patch
copyright: © Tom Chambers
# sherpa-onnx-node is a native addon (Parakeet dictation on this computer): a
# worker thread loads it with require(), which cannot read a .node out of the asar.
asarUnpack:
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-*/**
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  # Tray template icon — main.ts resolves it at build/trayIconTemplate.png
  # inside the asar. Without these globs it's absent and createTray throws on
  # every launch (no menubar icon). NO FALLBACK: the asset must ship.
  - build/trayIconTemplate.png
  - build/trayIconTemplate@2x.png
  # The Linux tray shows the app icon (panels there do not tint a template image).
  - build/icon.png
# What "On this computer" runs with nothing installed: the Patch server release and
# the host build for this platform (scripts/stage-resources.cjs puts them in
# build/staged). first-run/index.ts reads them from resources/server and
# resources/host — the folder was named daemon here once, and the app shipped
# without its host builds.
extraResources:
  - from: build/staged/server
    to: server
mac:
  extraResources:
    # Meeting mode's native audio helper (scripts/build-native.cjs): system audio via
    # a Core Audio tap, and noticing which apps have the mic open. macOS only.
    - from: build/native/patch-audio
      to: bin/patch-audio
    # NOT the host build yet. Notarisation unpacks the tarball and refuses the
    # host's binaries (signed without a secure timestamp; sherpa-onnx's not
    # signed at all), which failed every release. Until build-host.mjs signs
    # them for notarisation, the Mac app ships without its host, as before.
  category: public.app-category.developer-tools
  # App icon = the web favicon (build/icon.png, rendered 1024² from
  # packages/web/public/favicon.svg). electron-builder generates the .icns.
  icon: build/icon.png
  # The arm64 zip is what electron-updater pulls out of latest-mac.yml; the dmg is
  # the download the website hands a new user (published as Patch-mac-arm64.dmg
  # by scripts/promote.mjs). Both are built only by the release workflow on a
  # GitHub runner, which signs and notarises the dmg after this. (`hdiutil` cannot
  # attach a disk image from an ssh session, so a dmg cannot be built that way.)
  target:
    - target: zip
      arch: [arm64]
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  # Signing: electron-builder signs with the Developer ID identity named by
  # CSC_NAME (in a keychain the release workflow sets up). Notarisation is the
  # afterSign hook below, authenticated with an App Store Connect API key.
  notarize: false # we run notarytool ourselves via `afterSign` (scripts/notarize.cjs)
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # extraResources are not signed with the app unless named; the helper must be,
  # or hardened runtime and notarization refuse it.
  binaries:
    - Contents/Resources/bin/patch-audio
  # The system-audio permission prompt's wording (Meeting mode hears the call).
  extendInfo:
    NSAudioCaptureUsageDescription: Patch hears your meetings' audio so it can take notes.
afterSign: scripts/notarize.cjs
# Update feed. NO server address is built in (spec/05 § Desktop first run): the
# feed is the server this app is connected to, set at launch (main.ts,
# autoUpdater.setFeedURL). electron-builder still needs a generic provider to
# write latest-mac.yml and app-update.yml; the url below is a placeholder that
# is replaced before the first check and resolves nowhere.
publish:
  provider: generic
  url: https://updates.invalid/api/desktop/
  channel: latest
linux:
  # One x86_64 AppImage: electron-updater replaces it in place from latest-linux.yml.
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Development
  executableName: patch
  artifactName: Patch-${version}-x86_64.${ext}
  extraResources:
    - from: build/staged/host
      to: host
# Windows stays deferred.
