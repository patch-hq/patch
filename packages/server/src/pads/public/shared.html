<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pad</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; background: #f4f4f4; color: #111; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #ddd; }
  h1 { font-size: 15px; margin: 0; flex: none; }
  nav { display: flex; gap: 6px; overflow-x: auto; }
  nav button { min-height: 44px; padding: 0 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; font: inherit; white-space: nowrap; }
  nav button[aria-current="true"] { background: #111; color: #fff; border-color: #111; }
  main { flex: 1; min-height: 0; display: flex; justify-content: center; overflow: auto; }
  iframe { border: 0; background: #fff; height: 100%; width: 100%; }
  #err { padding: 16px; color: #b00020; }
</style>
</head>
<body>
<header><h1 id="name"></h1><nav id="screens"></nav></header>
<main><iframe id="view" title="Pad screen"></iframe></main>
<div id="err" hidden></div>
<script>
(async () => {
  const base = location.pathname.replace(/\/?$/, '/');
  const frame = document.getElementById("view");
  try {
    const r = await fetch(base + 'api');
    if (!r.ok) throw new Error('This Pad is not shared (' + r.status + ')');
    const pad = await r.json();
    document.title = pad.name;
    document.getElementById('name').textContent = pad.name;
    const nav = document.getElementById('screens');
    const show = (s, btn) => {
      nav.querySelectorAll('button').forEach((b) => b.removeAttribute('aria-current'));
      btn.setAttribute('aria-current', 'true');
      const [file, hash] = s.path.split('#');
      frame.style.width = s.width ? s.width + 'px' : pad.device === 'phone' ? '390px' : '100%';
      frame.src = base + 'f/' + file.split('/').map(encodeURIComponent).join('/') + (hash ? '#' + hash : '');
    };
    pad.screens.forEach((s, i) => {
      const b = document.createElement('button');
      b.textContent = s.name;
      b.onclick = () => show(s, b);
      nav.appendChild(b);
      if (i === 0) show(s, b);
    });
    if (!pad.screens.length) throw new Error('This Pad has no screens');
  } catch (e) {
    const el = document.getElementById('err');
    el.hidden = false;
    el.textContent = e.message;
  }
})();
</script>
</body>
</html>
