<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call sounds</title>
<style>
  :root { --ink:#1b1813; --ink3:#645c50; --line:#ddd6c6; --paper:#f6f4ee; --card:#fff; --leaf:#46802f; --tint:#e7f0dd; }
  @media (prefers-color-scheme: dark) { :root { --ink:#efede9; --ink3:#928d84; --line:#4a463f; --paper:#191817; --card:#242220; --leaf:#77a966; --tint:#252e1f; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 40px; background: var(--paper); color: var(--ink); font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  .top { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  table { width: 100%; max-width: 720px; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
  tr:first-child td { border-top: 0; }
  td.state { font-weight: 600; width: 40%; }
  td.opts { text-align: right; white-space: nowrap; }
  button { font: inherit; font-size: 15px; min-width: 44px; min-height: 40px; padding: 6px 12px; margin-left: 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); cursor: pointer; }
  button.picked { border-color: var(--leaf); font-weight: 700; }
  button:active, button.playing { background: var(--tint); border-color: var(--leaf); color: var(--leaf); }
  .top button { margin-left: 0; }
</style>
</head>
<body>
<h1>Call sounds</h1>
<div class="top">
  <button id="callA">Play a whole call (picks)</button>
  <button id="stop">Stop</button>
</div>
<table id="list"></table>

<script>
let ctx;
const live = new Set();
function ac() { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); return ctx; }

// One note with a soft attack and decay.
function note(t, freq, dur, { type = 'sine', gain = 0.18, glide = null, attack = 0.012 } = {}) {
  const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  live.add(o); o.onended = () => live.delete(o);
}
// A bell: a fundamental with a quieter, faster-fading overtone.
function bell(t, f, dur = 0.9, gain = 0.16) { note(t, f, dur, { gain }); note(t, f * 2.76, dur * 0.4, { gain: gain * 0.25 }); }
// A short filtered noise burst, for ticks and clicks.
function tick(t, { freq = 1800, dur = 0.035, gain = 0.25 } = {}) {
  const c = ac(), len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 4; g.gain.value = gain;
  s.connect(f).connect(g).connect(c.destination); s.start(t); live.add(s); s.onended = () => live.delete(s);
}

const C5 = 523.25, D5 = 587.33, E5 = 659.25, G5 = 783.99, A4 = 440, G4 = 392, E4 = 329.63, C4 = 261.63, A5 = 880, C6 = 1046.5;

// state → three versions; each draws from time t and returns its length in seconds.
const PICKS = {"Agent working (direct calls only)": "E", "Reconnecting": "F", "Connected, listening": "A", "Connecting": "A", "Passed to the agent": "A", "Reconnected": "A", "Ended": "A", "Paused": "B", "Agent calling you": "C"};
const SOUNDS = [
  ['Connecting', [
    t => { for (let i = 0; i < 3; i++) note(t + i * 0.8, A4, 0.35, { gain: 0.1 }); return 2.4; },
    t => { for (let i = 0; i < 2; i++) { note(t + i * 1.2, E5, 0.4, { gain: 0.09 }); note(t + i * 1.2 + 0.4, C5, 0.4, { gain: 0.09 }); } return 2.4; },
    t => { note(t, 300, 1.4, { gain: 0.08, glide: 600, attack: 0.3 }); return 1.5; },
  ]],
  ['Connected, listening', [
    t => { note(t, C5, 0.18); note(t + 0.13, G5, 0.3); return 0.5; },
    t => { note(t, C5, 0.15); note(t + 0.1, E5, 0.15); note(t + 0.2, G5, 0.3); return 0.55; },
    t => { bell(t, A5, 0.5, 0.12); return 0.6; },
  ]],
  ['Passed to the agent', [
    t => { note(t, 220, 0.08, { type: 'triangle', gain: 0.2 }); return 0.15; },
    t => { tick(t, { freq: 1200 }); return 0.1; },
    t => { tick(t, { freq: 1500, gain: 0.18 }); tick(t + 0.11, { freq: 1500, gain: 0.18 }); return 0.2; },
  ]],
  ['Reconnecting', [
    // the old C, kept for comparison
    t => { for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) note(t + i * 1.0 + j * 0.12, 700, 0.07, { type: 'triangle', gain: 0.08 }); return 2.0; },
    // D: sonar ping, repeating
    t => { for (let i = 0; i < 3; i++) { note(t + i * 1.1, 880, 0.6, { gain: 0.07 }); note(t + i * 1.1 + 0.25, 880, 0.5, { gain: 0.025 }); } return 3.3; },
    // E: soft double heartbeat
    t => { for (let i = 0; i < 3; i++) { note(t + i * 1.0, 90, 0.18, { type: 'triangle', gain: 0.35 }); note(t + i * 1.0 + 0.2, 80, 0.2, { type: 'triangle', gain: 0.25 }); } return 3.0; },
    // F: muted two-tone, like a line searching
    t => { for (let i = 0; i < 3; i++) { note(t + i * 0.9, 600, 0.12, { type: 'square', gain: 0.03 }); note(t + i * 0.9 + 0.15, 600, 0.12, { type: 'square', gain: 0.03 }); } return 2.7; },
  ], 'CDEF'],
  ['Agent working (direct calls only)', [
    // the old C, kept for comparison
    t => { note(t, E4, 0.2, { gain: 0.05 }); note(t + 0.2, G4, 0.25, { gain: 0.05 }); return 0.5; },
    // D: slow soft pulse, continuous
    t => { for (let i = 0; i < 5; i++) note(t + i * 1.2, G4, 1.0, { gain: 0.04, attack: 0.45 }); return 6.0; },
    // E: quiet alternating two notes, continuous
    t => { for (let i = 0; i < 6; i++) note(t + i * 0.8, i % 2 ? G4 : E4, 0.7, { gain: 0.035, attack: 0.25 }); return 4.8; },
    // F: faint clock tick
    t => { for (let i = 0; i < 8; i++) tick(t + i * 0.6, { freq: 2200, gain: 0.05, dur: 0.02 }); return 4.8; },
  ], 'CDEF'],
  ['Reconnected', [
    t => { note(t, C5, 0.18); note(t + 0.13, G5, 0.3); return 0.5; },
    t => { note(t, G4, 0.12); note(t + 0.1, C5, 0.12); note(t + 0.2, E5, 0.25); return 0.5; },
    t => { bell(t, E5, 0.5, 0.12); return 0.6; },
  ]],
  ['Paused', [
    t => { note(t, G4, 0.6, { gain: 0.12, attack: 0.04 }); return 0.7; },
    t => { note(t, E5, 0.2, { gain: 0.09 }); note(t + 0.18, C5, 0.35, { gain: 0.09 }); return 0.6; },
    t => { note(t, 120, 0.25, { type: 'triangle', gain: 0.25 }); return 0.3; },
  ]],
  ['Ended', [
    t => { note(t, G5, 0.18); note(t + 0.15, E5, 0.18); note(t + 0.3, C5, 0.4); return 0.75; },
    t => { note(t, 700, 0.5, { gain: 0.1, glide: 250 }); return 0.55; },
    t => { note(t, E4, 0.25, { gain: 0.14 }); note(t + 0.22, C4, 0.5, { gain: 0.14 }); return 0.8; },
  ]],
  ['Agent calling you', [
    t => { for (let r = 0; r < 2; r++) [C5, E5, G5, E5].forEach((f, i) => note(t + r * 1.4 + i * 0.13, f, 0.16, { type: 'triangle', gain: 0.12 })); return 2.8; },
    t => { for (let r = 0; r < 2; r++) { bell(t + r * 1.2, A5, 0.5, 0.12); bell(t + r * 1.2 + 0.25, A5, 0.6, 0.12); } return 2.4; },
    t => { for (let r = 0; r < 3; r++) [C5, E5, G5].forEach((f, i) => note(t + r * 0.9 + i * 0.1, f, 0.12, { gain: 0.1 })); return 2.7; },
  ]],
];

function play(fn, btn) {
  const c = ac(); if (c.state === 'suspended') c.resume();
  const len = fn(c.currentTime + 0.03);
  if (btn) { btn.classList.add('playing'); setTimeout(() => btn.classList.remove('playing'), len * 1000); }
}

const list = document.getElementById('list');
SOUNDS.forEach(([name, versions, letters]) => {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td class="state">${name}</td><td class="opts"></td>`;
  versions.forEach((fn, i) => {
    const b = document.createElement('button'); b.textContent = (letters || 'ABC')[i];
    if (PICKS[name] === b.textContent) b.classList.add('picked');
    b.onclick = () => play(fn, b); tr.lastChild.appendChild(b);
  });
  list.appendChild(tr);
});

// A whole call using every A: connect, a hand-off, a drop, then hang up.
document.getElementById('callA').onclick = () => {
  const order = ['Connecting', 'Connected, listening', 'Passed to the agent', 'Reconnecting', 'Reconnected', 'Paused', 'Ended'];
  const c = ac(); if (c.state === 'suspended') c.resume();
  let t = c.currentTime + 0.05;
  for (const name of order) { const row = SOUNDS.find((s) => s[0] === name), ix = Math.max(0, (row[2] || 'ABC').indexOf(PICKS[name] || 'x')); const fn = row[1][ix]; t += fn(t) + 1.0; }
};
document.getElementById('stop').onclick = () => { live.forEach((n) => { try { n.stop(); } catch {} }); live.clear(); };
</script>
</body>
</html>
