<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Patch — usage placement</title>
  <style>
    :root { color-scheme: dark; --bg:#171817; --panel:#1d1e1d; --line:#303230; --ink:#f1f1ec; --muted:#92968e; --green:#91ad45; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#101110; color:var(--ink); font:13px/1.35 Inter, ui-sans-serif, system-ui, sans-serif }
    .window { width:min(1120px, calc(100vw - 32px)); height:min(690px, calc(100vh - 32px)); background:var(--bg); border:1px solid #292b29; border-radius:14px; overflow:hidden; box-shadow:0 24px 80px #0008 }
    header { height:94px; padding:17px 25px 14px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:1fr minmax(0,auto) 1fr; align-items:start; gap:18px }
    .nav, .actions { display:flex; align-items:center; gap:8px; padding-top:7px }
    .actions { justify-content:flex-end }
    button { color:#a8aca4; background:transparent; border:0; padding:6px; border-radius:7px; font:inherit }
    button:hover { background:#282a28; color:var(--ink) }
    .centre { min-width:0; display:flex; flex-direction:column; align-items:center; gap:7px }
    .title-row { max-width:100%; display:flex; align-items:center; gap:9px }
    h1 { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin:0; font:600 17px/1.3 Inter, ui-sans-serif, system-ui, sans-serif }
    .open { width:27px; height:27px; display:grid; place-items:center }
    .meta-row { display:flex; align-items:center; justify-content:center; gap:10px; color:var(--muted); font-size:11px; white-space:nowrap }
    .divider { color:#51544f }
    .usage { display:flex; align-items:center; gap:7px; padding:3px 5px; margin:-3px -5px; cursor:pointer }
    .usage-label { color:#b5b8b1; font-variant-numeric:tabular-nums }
    .track { width:112px; height:6px; border-radius:99px; overflow:hidden; background:#383b37; box-shadow:inset 0 0 0 1px #ffffff08 }
    .fill { display:block; width:28%; height:100%; border-radius:inherit; background:var(--green) }
    main { height:calc(100% - 94px); display:grid; place-items:center; color:#666a64 }
    .hint { text-align:center; font-size:12px }
    svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round }
    @media (max-width:640px) {
      body { place-items:stretch; }
      .window { width:100%; height:100vh; border:0; border-radius:0 }
      header { height:88px; padding:14px 12px 12px; grid-template-columns:58px minmax(0,1fr) 58px; gap:6px }
      .nav button:nth-child(2), .actions button:not(:last-child) { display:none }
      .track { width:82px }
      .meta-row { gap:7px }
      main { height:calc(100% - 88px) }
    }
  </style>
</head>
<body>
  <section class="window" aria-label="Patch chat mockup">
    <header>
      <div class="nav">
        <button aria-label="Back">←</button><button aria-label="Forward">→</button>
      </div>
      <div class="centre">
        <div class="title-row">
          <h1>Review usage display</h1>
          <button class="open" aria-label="Open in new window">
            <svg viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8"/><path d="M19 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
          </button>
        </div>
        <div class="meta-row">
          <span>portfolio · Mac</span>
          <span class="divider">·</span>
          <button class="usage" aria-label="Weekly usage 28%, resets Tuesday at 08:30 BST">
            <span class="usage-label">Weekly 28%</span>
            <span class="track" aria-hidden="true"><i class="fill"></i></span>
          </button>
        </div>
      </div>
      <div class="actions">
        <button aria-label="Search">⌕</button><button aria-label="More">•••</button>
      </div>
    </header>
    <main><div class="hint">Usage now belongs to the chat metadata line.<br>The whole labelled control opens the detailed account popover.</div></main>
  </section>
</body>
</html>
