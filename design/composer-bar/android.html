<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Android composer</title>
<style>:root{--bg-app:#f2f0ea;--bg-panel:#faf8f3;--bg-elevated:#fff;--bg-soft:#f4f2eb;--ink:#1b1813;--ink-2:#423b32;--ink-3:#645c50;--ink-faint:#8a8175;--line:#ddd6c6;--accent:#46802f;--accent-soft:#cfddc1;--danger:#b4462f}
*{box-sizing:border-box}
body{margin:0;font-family:"Figtree Variable",Figtree,system-ui,sans-serif;background:var(--bg-panel);color:var(--ink);font-size:15px}
.note{color:var(--ink-3);font-size:13px;margin:0 0 8px;max-width:780px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:28px 0 8px;font-weight:600}
.composer{width:100%;display:flex;flex-direction:column;gap:8px}
.field{position:relative}
.field textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:9px 42px 9px 14px;font:inherit;resize:none;background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04);display:block;height:40px}
.field .mic{position:absolute;right:4px;bottom:4px;width:32px;height:32px;border:0;background:transparent;color:var(--ink-3);display:grid;place-items:center;border-radius:6px}
.row{display:flex;align-items:center;gap:6px}
.btn{width:40px;height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink-2);display:grid;place-items:center;flex:0 0 auto}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:0 0 auto}
.set{height:40px;display:inline-flex;align-items:center;gap:5px;padding:0 8px;border-radius:6px;color:var(--ink-3);font-size:13px;white-space:nowrap;flex:0 0 auto;border:1px solid transparent;background:transparent}
.set:hover{background:var(--bg-soft);color:var(--ink-2)}
.set svg{width:16px;height:16px}
.set .caret{width:12px;height:12px;opacity:.7}
.set.danger{color:var(--danger)}
.end{margin-left:auto;display:flex;gap:6px;align-items:center}
.ring{width:40px;height:40px;display:grid;place-items:center}
.stop{border-color:var(--danger);color:var(--danger);background:#fbeeea}
.send{background:var(--accent);border-color:var(--accent);color:#fff}
.menu{position:absolute;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;min-width:260px;font-size:14px;z-index:5}
.menu .h{font-size:12px;color:var(--ink-faint);padding:6px 10px 4px}
.menu .o{padding:8px 10px;border-radius:6px;display:flex;gap:10px;align-items:flex-start}
.menu .o.sel{background:var(--bg-soft)}
.menu .o small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.menu .o svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px;color:var(--ink-3)}
.menu .ck{margin-left:auto;color:var(--accent)}

body{background:#fff}
main{padding:12px;max-width:420px;margin:0 auto}
.btn{width:36px;height:36px;border:0;background:transparent}
.send{border-radius:50%;width:32px;height:32px;background:var(--accent);color:#fff;border:0;display:grid;place-items:center}
.set{height:36px;padding:0 6px}
.field textarea{border-radius:20px;padding-left:16px}
.field .add{position:absolute;left:4px;bottom:4px;width:32px;height:32px;border:0;background:transparent;color:var(--ink-3);display:grid;place-items:center;border-radius:6px;z-index:1}
.field textarea{padding-left:40px !important}
.btn.q{border-color:transparent;background:transparent;color:var(--ink-3)}
.addmenu{position:static;min-width:0;max-width:260px}
</style></head><body><main>
<h2>Android: one line</h2>
<p class="note">Camera, photo, file and sketch move into the + inside the box. The row below holds just the settings and send, on one line.</p>
<div class="composer">
  <div class="field"><button class="add" title="Add: file, image, sketch"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button><textarea placeholder="Message"></textarea><button class="mic"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic" aria-hidden="true"><path d="M12 19v3"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><rect x="9" y="2" width="6" height="13" rx="3"></rect></svg></button></div>
  <div class="row">
    
    <button class="set danger"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock-open" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg></button>
    <button class="set">Opus 5.5<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    <button class="set"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-round" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></button>
    <button class="set"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-gauge" aria-hidden="true"><path d="m12 14 4-4"></path><path d="M3.34 19a10 10 0 1 1 17.32 0"></path></svg></button>
    <div class="end"><span class="ring"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#ddd6c6" stroke-width="2.5"/><circle cx="12" cy="12" r="9" fill="none" stroke="#46802f" stroke-width="2.5" stroke-dasharray="20 57" transform="rotate(-90 12 12)" stroke-linecap="round"/></svg></span><button class="send"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path><path d="m21.854 2.147-10.94 10.939"></path></svg></button></div>
  </div>
</div>
<h2>The + in the box</h2>
<div class="menu" style="position:static;min-width:0">
  <div class="o"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-camera" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"></path><circle cx="12" cy="13" r="3"></circle></svg><div>Take photo</div></div>
  <div class="o"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg><div>Photo or image</div></div>
  <div class="o"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paperclip" aria-hidden="true"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"></path></svg><div>Any file</div></div>
  <div class="o"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pen-line" aria-hidden="true"><path d="M13 21h8"></path><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg><div>Sketch</div></div>
</div>
</main></body></html>
