# Builds Patch and publishes it as a GitHub Release. This is the only way a
# change reaches anyone, the developer included.
#
#   dev      every push to main, published as a prerelease tagged dev-<version>
#   stable   `node scripts/promote.mjs <version>` re-publishes a dev release,
#            unchanged, as v<version>
#
# Servers follow a channel (`patch-server channel dev|stable`), mirror its
# newest release and update themselves; hosts, the desktop app and the phone
# update from their server. Nothing here depends on anyone's machine being
# awake.
#
# Runs only in the project's public repository (every job is guarded below):
# Actions minutes are free for public repositories.
#
# Secrets:
#   PATCH_ARTIFACT_SIGNING_KEY       the ed25519 key hosts verify self-updates against
#   PATCH_ANDROID_KEYSTORE_B64       the Android release keystore, base64
#   PATCH_ANDROID_CREDENTIALS_JSON   its credentials.json (alias and passwords)
#   PATCH_MAC_CERT_P12_B64           Developer ID Application certificate + key, base64 .p12
#   PATCH_MAC_CERT_PASSWORD          its password
#   APPLE_API_KEY_P8                 App Store Connect API key, for notarisation
#   APPLE_API_KEY_ID, APPLE_API_ISSUER
#   EXPO_TOKEN                       publishes the phone's over-the-air update

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The full gate (scripts/verify.mjs), browser layer included: a runner is a
  # clean machine of its own, so nothing here is skipped.
  verify:
    if: github.repository == 'tomchambers2/patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @patch/web exec playwright install --with-deps chromium
      # The host's browser tests drive a headed Chromium on Xvfb, and its Codex
      # tests keep credentials in the native keyring (Secret Service over D-Bus).
      - run: sudo apt-get install -y -qq xvfb x11-utils gnome-keyring libsecret-tools dbus-x11
      - name: The gate
        env:
          PATCH_RUN_BROWSER_GATE: '1'
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            node scripts/verify.mjs
          '

  server:
    if: github.repository == 'tomchambers2/patch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the patch component of the version is the commit count
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - id: version
        run: |
          echo "version=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build the server and web release
        run: pnpm run build:server
      - uses: actions/upload-artifact@v4
        with:
          name: server
          if-no-files-found: error
          path: |
            dist/server/patch-server-*.tar.gz
            dist/server/patch-server.tar.gz
            dist/server/patch-server.tar.gz.sha256
            dist/server/install.sh

  host:
    if: github.repository == 'tomchambers2/patch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build the host's JavaScript
        run: pnpm turbo build --filter=@patch/host... --output-logs=errors-only
      - name: Fetch the pinned runtime, native addon and model
        run: node scripts/fetch-vendor.mjs --out="$RUNNER_TEMP/vendor" --targets=${{ matrix.target }}
      - name: Build and sign the host artifact
        env:
          SIGNING_KEY: ${{ secrets.PATCH_ARTIFACT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "PATCH_ARTIFACT_SIGNING_KEY is not set: an unsigned host would be refused by every install" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/artifact-signing.key"
          PATCH_BUILD_VENDOR="$RUNNER_TEMP/vendor" \
          PATCH_ARTIFACT_SIGNING_KEY="$RUNNER_TEMP/artifact-signing.key" \
          PATCH_BUILD_TARGETS=${{ matrix.target }} \
          PATCH_BUILD_OUT="$RUNNER_TEMP/out" \
          node scripts/build-host.mjs
          rm -f "$RUNNER_TEMP/artifact-signing.key"
          # One manifest per target; the release consumer merges them.
          mv "$RUNNER_TEMP/out/host-latest.json" "$RUNNER_TEMP/out/host-latest-${{ matrix.target }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/out/*.tar.gz
            ${{ runner.temp }}/out/*.tar.gz.sig
            ${{ runner.temp }}/out/host-latest-*.json

  android:
    if: github.repository == 'tomchambers2/patch'
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.build.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Android SDK pieces the build needs
        run: |
          set -euo pipefail
          # Feeding "y" from a process substitution: a pipe would make `yes`
          # exit on SIGPIPE when sdkmanager stops reading, which pipefail
          # reports as a failure of a step that worked.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;26.1.10909125" "build-tools;35.0.0"
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.PATCH_ANDROID_KEYSTORE_B64 }}
          CREDENTIALS_JSON: ${{ secrets.PATCH_ANDROID_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          # Every install is signed with this one key; a build signed with any
          # other is refused by the phone, so a missing key stops here.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$CREDENTIALS_JSON" ]; then
            echo "PATCH_ANDROID_KEYSTORE_B64 and PATCH_ANDROID_CREDENTIALS_JSON must both be set" >&2
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.patch-mobile-credentials"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.patch-mobile-credentials/patch-upload.keystore"
          printf '%s' "$CREDENTIALS_JSON" > "$HOME/.patch-mobile-credentials/credentials.json"
      - name: Build the release APK
        id: build
        run: |
          set -euo pipefail
          read -r VERSION SHA BUILT < <(node scripts/version.mjs --json | node -e 'const v=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(v.version,v.gitSha,v.builtAt)')
          node scripts/build-apk-local.mjs --version "$VERSION" --sha "$SHA" --built-at "$BUILT" | tee "$RUNNER_TEMP/apk.log"
          APK=$(sed -n 's/^##apk //p' "$RUNNER_TEMP/apk.log" | tail -1)
          test -f "$APK"
          # Refuse anything that is not this app: a wrong id would install beside it.
          PKG=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          if [ "$PKG" != "io.github.tomchambers2.patch" ]; then
            echo "built package is '$PKG', expected io.github.tomchambers2.patch" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$APK" "$RUNNER_TEMP/apk/patch-$VERSION.apk"
          printf '{"version":"%s","gitSha":"%s","builtAt":"%s","file":"patch-%s.apk"}\n' "$VERSION" "$SHA" "$BUILT" "$VERSION" > "$RUNNER_TEMP/apk/android-latest.json"
          rm -rf "$HOME/.patch-mobile-credentials" apps/mobile/credentials
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/apk/*.apk
            ${{ runner.temp }}/apk/android-latest.json

  # The macOS host and the desktop app, signed with the Developer ID
  # certificate; the app is notarised. One job, because the app carries this
  # very host build inside it.
  mac:
    if: github.repository == 'tomchambers2/patch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Signing keychain and notarisation key
        env:
          P12_B64: ${{ secrets.PATCH_MAC_CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.PATCH_MAC_CERT_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$P12_B64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$API_KEY_P8" ]; then
            echo "PATCH_MAC_CERT_P12_B64, PATCH_MAC_CERT_PASSWORD and APPLE_API_KEY_P8 must all be set" >&2
            exit 1
          fi
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KC_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "no Developer ID Application identity in the imported certificate" >&2
            exit 1
          fi
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Build the host's JavaScript
        run: pnpm turbo build --filter=@patch/host... --output-logs=errors-only
      - name: Fetch the pinned runtime, native addon and model
        run: node scripts/fetch-vendor.mjs --out="$RUNNER_TEMP/vendor" --targets=darwin-arm64
      - name: Build and sign the host artifact
        env:
          SIGNING_KEY: ${{ secrets.PATCH_ARTIFACT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "PATCH_ARTIFACT_SIGNING_KEY is not set: an unsigned host would be refused by every install" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/artifact-signing.key"
          # Into dist/host, where the desktop build picks the host up.
          PATCH_BUILD_VENDOR="$RUNNER_TEMP/vendor" \
          PATCH_ARTIFACT_SIGNING_KEY="$RUNNER_TEMP/artifact-signing.key" \
          PATCH_CODESIGN_IDENTITY="$IDENTITY" \
          PATCH_BUILD_TARGETS=darwin-arm64 \
          node scripts/build-host.mjs
          rm -f "$RUNNER_TEMP/artifact-signing.key"
          mkdir -p "$RUNNER_TEMP/out"
          cp dist/host/*.tar.gz dist/host/*.tar.gz.sig "$RUNNER_TEMP/out/"
          cp dist/host/host-latest.json "$RUNNER_TEMP/out/host-latest-darwin-arm64.json"
      - name: Build, sign and notarise the desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          export CSC_NAME="$IDENTITY" APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          pnpm turbo build --filter=@patch/desktop... --output-logs=errors-only
          pnpm --filter @patch/desktop dist
      - name: Check the app is what it claims to be
        run: |
          set -euo pipefail
          APP=packages/desktop/release/mac-arm64/Patch.app
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -q 'Identifier=io.github.tomchambers2.patch'
          # Notarised and stapled: Gatekeeper accepts it as a download.
          spctl --assess --type execute -vv "$APP" 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
          PATCH_REAL_DESKTOP=1 PATCH_TEST_DESKTOP_BINARY="$PWD/$APP/Contents/MacOS/Patch" \
            node --test packages/desktop/scripts/single-instance.test.cjs
      - name: Collect the desktop release
        run: |
          set -euo pipefail
          read -r VERSION SHA BUILT < <(node scripts/version.mjs --json | node -e 'const v=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(v.version,v.gitSha,v.builtAt)')
          REL=packages/desktop/release
          ZIP="Patch-$VERSION-arm64-mac.zip"
          cp "$REL/latest-mac.yml" "$REL/$ZIP" "$RUNNER_TEMP/out/"
          if [ -f "$REL/$ZIP.blockmap" ]; then cp "$REL/$ZIP.blockmap" "$RUNNER_TEMP/out/"; fi
          # electron-builder's yml has a version but no git sha; this traces the binary to a commit.
          printf '{"version":"%s","gitSha":"%s","builtAt":"%s","file":"%s"}\n' "$VERSION" "$SHA" "$BUILT" "$ZIP" > "$RUNNER_TEMP/out/desktop-latest.json"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          path: ${{ runner.temp }}/out/*

  # The phone's JavaScript, as an over-the-air update for installed APKs. Phones
  # fetch it straight from Expo, not through a server, so it goes out only once
  # everything else has built.
  ota:
    if: github.repository == 'tomchambers2/patch'
    needs: [verify, server, host, mac, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/publish-ota.mjs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  publish:
    if: github.repository == 'tomchambers2/patch'
    needs: [verify, server, host, mac, android, ota]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.server.outputs.version }}
        run: |
          set -euo pipefail
          tag="dev-$VERSION"
          gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Patch $VERSION" --prerelease \
            --notes "Development build $VERSION of ${GITHUB_SHA::8}."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
