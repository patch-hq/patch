# Every other "needs attention" event goes to Patch as one webhook, which spawns
# a fresh chat for the PR or issue (conflicts: pr-conflicts.yml). Nothing is
# handed back to the chat that opened it, and there is no attempt cap.
#
#   - a `test` run fails on a PR            -> pr-check-failed
#   - a `test` run fails on main            -> main-failed (names the commit and
#                                              every commit since main was last green)
#   - an issue is opened                    -> issue-opened
#   - run by hand with a number             -> the same, for backlog items
#
# A flaky test is a failure like any other: the agent decides.

name: needs-attention

on:
  workflow_run:
    workflows: [test]
    types: [completed]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      kind:
        description: pr-check-failed | merge-queue-failed | pr-conflict | issue-opened
        required: true
      number:
        description: PR or issue number
        required: true
      detail:
        description: What is wrong
        required: false

permissions:
  contents: read
  actions: read # finds main's last green test run

jobs:
  notify:
    if: github.repository == 'patch-hq/patch' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'failure' && (github.event.workflow_run.event == 'pull_request' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          PATCH_ATTENTION_URL: ${{ secrets.PATCH_ATTENTION_URL }}
          PATCH_ATTENTION_SECRET: ${{ secrets.PATCH_ATTENTION_SECRET }}
          EVENT: ${{ github.event_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          ISSUE: ${{ github.event.issue.number }}
          IN_KIND: ${{ inputs.kind }}
          IN_NUMBER: ${{ inputs.number }}
          IN_DETAIL: ${{ inputs.detail }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            issues)
              node scripts/needs-attention.mjs --kind issue-opened --repo "$GITHUB_REPOSITORY" --number "$ISSUE" \
                --detail "Investigate; close the issue yourself or open a PR saying Closes #$ISSUE." ;;
            workflow_dispatch)
              node scripts/needs-attention.mjs --kind "$IN_KIND" --repo "$GITHUB_REPOSITORY" --number "$IN_NUMBER" --detail "$IN_DETAIL" ;;
            workflow_run)
              if [ "$RUN_EVENT" = push ]; then
                # One run on main covers every commit merged since the last green one.
                green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
                if [ -n "$green" ]; then
                  commits=$(git log --format='%h %s' "$green..$RUN_SHA")
                else
                  commits=$(git log -1 --format='%h %s' "$RUN_SHA")
                fi
                node scripts/needs-attention.mjs --kind main-failed --repo "$GITHUB_REPOSITORY" --sha "$RUN_SHA" \
                  --detail "$(printf 'Failed test run on main: %s\nCommits since main was last green (%s):\n%s' "$RUN_URL" "${green:-unknown}" "$commits")"
              else
                node scripts/needs-attention.mjs --kind pr-check-failed --repo "$GITHUB_REPOSITORY" --number "$RUN_PR" --detail "Failed check run: $RUN_URL"
              fi ;;
          esac
