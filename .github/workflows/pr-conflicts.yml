# After main moves, any open PR that no longer merges cleanly is labelled
# `needs-rebase` and gets a comment, which is the hand-back to the chat that
# owns it: rebase on main, resolve, force-push. The label clears itself once
# the PR merges cleanly again.

name: pr-conflicts

on:
  push:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  conflicts:
    if: github.repository == 'tomchambers2/patch'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create needs-rebase --color d93f0b --description "Conflicts with main: rebase and resolve" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          for n in $(gh pr list --state open --json number --jq '.[].number' --repo "$GITHUB_REPOSITORY"); do
            # mergeable is computed lazily; ask until GitHub has an answer.
            state=UNKNOWN
            for _ in 1 2 3 4 5 6; do
              state=$(gh pr view "$n" --json mergeable --jq .mergeable --repo "$GITHUB_REPOSITORY")
              [ "$state" != UNKNOWN ] && break
              sleep 10
            done
            has=$(gh pr view "$n" --json labels --jq '[.labels[].name] | index("needs-rebase") != null' --repo "$GITHUB_REPOSITORY")
            if [ "$state" = CONFLICTING ] && [ "$has" = false ]; then
              gh pr edit "$n" --add-label needs-rebase --repo "$GITHUB_REPOSITORY"
              gh pr comment "$n" --repo "$GITHUB_REPOSITORY" --body "Main moved and this PR now conflicts with it. Rebase onto main, resolve the conflicts, and force-push; auto-merge resumes once the tests pass."
            elif [ "$state" = MERGEABLE ] && [ "$has" = true ]; then
              gh pr edit "$n" --remove-label needs-rebase --repo "$GITHUB_REPOSITORY"
            fi
          done
