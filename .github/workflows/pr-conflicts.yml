# GitHub sends no event when main moves under a PR and it starts to conflict, so
# this runs on each push to main, finds the open PRs that no longer merge, and
# sends each one to Patch as a needs-attention webhook (a fresh chat rebases it).

name: pr-conflicts

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  conflicts:
    if: github.repository == 'patch-hq/patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          PATCH_ATTENTION_URL: ${{ secrets.PATCH_ATTENTION_URL }}
          PATCH_ATTENTION_SECRET: ${{ secrets.PATCH_ATTENTION_SECRET }}
        run: |
          set -euo pipefail
          for n in $(gh pr list --state open --json number --jq '.[].number' --repo "$GITHUB_REPOSITORY"); do
            # mergeable is computed lazily; ask until GitHub has an answer.
            state=UNKNOWN
            for _ in 1 2 3 4 5 6; do
              state=$(gh pr view "$n" --json mergeable --jq .mergeable --repo "$GITHUB_REPOSITORY")
              [ "$state" != UNKNOWN ] && break
              sleep 10
            done
            if [ "$state" = CONFLICTING ]; then
              node scripts/needs-attention.mjs --kind pr-conflict --repo "$GITHUB_REPOSITORY" --number "$n" \
                --detail "Conflicts with main as of $GITHUB_SHA. Rebase onto main, resolve, force-push."
            fi
          done
