# The test gate (scripts/verify.mjs), split across runners. A change is tested
# twice:
#
#   pull request  the cheap layers (lint, types, the static checks) and the unit,
#                 contract and integration suites of the packages the diff can
#                 reach: quick feedback, and the `tests` check a PR needs to merge
#   push to main  everything: every package's suites and the browser layer in
#                 four shards. release.yml publishes a commit only when this run
#                 is green, so a failure here stops the release, not the merges.
#
# PRs merge as soon as their own check is green, with no merge queue: a queue
# re-ran the full gate once per PR and could build only three at a time, so a
# busy day backed up for hours. Main is tested instead. Runs on main queue
# behind each other: one runs, and of the pushes that land meanwhile only the
# newest waits, so one run covers every PR merged while the last one ran. A
# commit whose run was skipped that way is superseded; release.yml skips it.
# A red main goes to needs-attention.yml as main-failed.
#
# scripts/ci-plan.mjs decides the slices: one runner each for the cheap layers,
# the host suites, the web suites and the remaining packages, plus the four
# browser shards on main. No runner repeats another's work.
#
# Runs only in the project's public repository: Actions minutes are free there.

name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR makes the older run pointless, so it is cancelled. Main
# is never cancelled mid-run (release.yml is waiting on it); pushes queue.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.repository == 'patch-hq/patch'
    runs-on: ubuntu-latest
    outputs:
      slices: ${{ steps.plan.outputs.slices }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - id: plan
        env:
          FULL: ${{ github.event_name != 'pull_request' }}
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$FULL" = true ]; then
            slices=$(node scripts/ci-plan.mjs --all)
          else
            slices=$(node scripts/ci-plan.mjs --base "$BASE")
          fi
          echo "slices=$slices" >> "$GITHUB_OUTPUT"

  verify:
    name: ${{ matrix.slice.name }}
    needs: [plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The runners are one shared pool with release.yml: keep a PR to four.
      max-parallel: ${{ github.event_name == 'pull_request' && 4 || 8 }}
      matrix:
        slice: ${{ fromJSON(needs.plan.outputs.slices) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
        with:
          system-deps: ${{ matrix.slice.system }}
      # Samples every 5s so a 137 can be traced to a process: memory, the
      # biggest resident processes, and the job's cgroup limit and OOM counter
      # (a cgroup kill leaves nothing in `free`). The log is printed on failure.
      - name: Memory sampler
        run: |
          nohup bash -c 'while true; do echo "--- mem $(date +%T)"; free -m | sed -n 2,3p; for f in memory.max memory.peak memory.events; do echo "$f: $(tr "\n" " " < /sys/fs/cgroup/$f 2>/dev/null)"; done; ps -eo rss,comm,args --sort=-rss | head -6 | cut -c1-160; sleep 5; done' > /tmp/mem.log 2>&1 &
      # Names the sender of any SIGKILL, whatever it is: the kernel's own
      # signal_generate event, read from tracefs, records the sending task. The
      # kill trace below only sees Node senders; this sees pkill, the runner, the
      # kernel. Needs no install. Fails the step if tracefs is unavailable.
      - name: Signal tracer
        run: |
          T=/sys/kernel/tracing
          # tracefs is root-only (0700), so test through sudo, and only mount if it is not already.
          mountpoint -q "$T" || sudo mount -t tracefs nodev "$T"
          sudo test -d "$T/events/signal/signal_generate" || { echo "::error::no tracefs signal events"; exit 1; }
          # The kernel rejects string comparisons in this filter, so the noisy targets (sleep, sh)
          # are dropped when the log is printed instead.
          echo 'sig == 9' | sudo tee "$T/events/signal/signal_generate/filter" >/dev/null
          echo 1 | sudo tee "$T/events/signal/signal_generate/enable" >/dev/null
          nohup sudo sh -c "cat $T/trace_pipe" > /tmp/sigtrace.log 2>&1 &
      - name: The gate
        timeout-minutes: 60
        env:
          PATCH_RUN_BROWSER_GATE: ${{ matrix.slice.shard != '' && '1' || '0' }}
          PATCH_BROWSER_SHARD: ${{ matrix.slice.shard }}
          LAYERS: ${{ matrix.slice.layers }}
          PACKAGES: ${{ matrix.slice.packages }}
          SYSTEM: ${{ matrix.slice.system }}
          # Logs who sends any SIGKILL or group kill (scripts/ci-killtrace.cjs).
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-killtrace.cjs
        run: |
          [ -n "$PATCH_BROWSER_SHARD" ] || unset PATCH_BROWSER_SHARD
          args=(--layers="$LAYERS")
          [ -z "$PACKAGES" ] || args+=(--packages="$PACKAGES")
          # The host's browser tests drive a headed Chromium on Xvfb, and its Codex
          # tests keep credentials in the native keyring (Secret Service over D-Bus).
          if [ "$SYSTEM" = true ]; then
            dbus-run-session -- bash -euo pipefail -c '
              printf "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
              node scripts/verify.mjs "$@"
            ' _ "${args[@]}"
          else
            node scripts/verify.mjs "${args[@]}"
          fi
      - name: Memory log and kernel OOM kills
        if: failure()
        run: |
          tail -n 120 /tmp/mem.log || true
          echo "--- kill trace"; tail -n 60 /tmp/killtrace.log || true
          echo "--- SIGKILLs, sender first (kernel signal_generate; comm-pid is the sender, comm= pid= the target)"; grep -v -E 'comm=(sleep|sh|head|yes) ' /tmp/sigtrace.log | tail -n 80 || true; echo "--- SIGKILLs not sent by a vitest worker"; grep -v -E 'vitest|comm=(sleep|sh|head|yes) ' /tmp/sigtrace.log | tail -n 40 || true
          echo "--- kernel"; (sudo dmesg || sudo journalctl -k --no-pager) 2>&1 | grep -i -E "out of memory|oom|killed process|cgroup" | tail -n 20 || true

  # The one check that branch protection and release.yml look at: green only
  # when the plan and every slice are. Reports on forks too, where the plan is
  # skipped, so it is failed rather than absent there.
  tests:
    needs: [plan, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.plan.result }}" = success || { echo "plan: ${{ needs.plan.result }}" >&2; exit 1; }
          test "${{ needs.verify.result }}" = success || { echo "verify: ${{ needs.verify.result }}" >&2; exit 1; }
