# The test suite (scripts/verify.mjs), on its own. Each change runs it twice:
#
#   pull request  the cheap layers (lint, types, unit, contract, integration)
#                 on one runner: quick feedback, and the `tests` check the
#                 ruleset needs before a PR may enter the merge queue
#   merge queue   the full gate, four shards, browser layer on, against main
#                 plus everything queued ahead of it
#
# The heavy run is in the queue because the queue caps how many entries it
# builds at once (the ruleset's max_entries_to_build), so it can never fill the
# runner pool. Run on every PR instead, a burst of agent PRs took all 20
# runners and the queue's and the release's own jobs waited half an hour.
#
# There is no run on push to main: main only moves through the queue, which
# fast-forwards it to the commit it tested, so that commit already carries the
# `tests` check release.yml waits for.
#
# Runs only in the project's public repository: Actions minutes are free there.

name: test

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR makes the older run pointless. A merge-queue run is never
# cancelled: its commit becomes main, and release.yml needs its result.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # In the queue, four runners wide: every runner runs the cheap layers, and the
  # browser layer is split between them with Playwright's --shard, because the
  # whole suite on one runner took about an hour. On a PR, one runner, cheap
  # layers only.
  verify:
    if: github.repository == 'patch-hq/patch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The account's runners are one shared pool. Eight open PRs at four shards
      # each filled it, and a fully built release sat an hour waiting for the
      # runner its publish job needs. A PR takes two at a time (its shards run
      # in two waves), so the pool keeps headroom; main still runs all four.
      max-parallel: ${{ github.event_name == 'pull_request' && 2 || 4 }}
      matrix:
        shard: ${{ fromJSON(github.event_name == 'merge_group' && '["1/4", "2/4", "3/4", "4/4"]' || '["1/1"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Headroom against the OOM killer (exit 137): the host suite's sidecars,
      # then headed Chromium, outgrow the runner's RAM. Swap turns a spike into
      # a slow moment instead of a killed shard.
      - name: Add swap
        run: |
          sudo fallocate -l 6G /mnt/ci-extra.swap
          sudo chmod 600 /mnt/ci-extra.swap
          sudo mkswap /mnt/ci-extra.swap
          sudo swapon /mnt/ci-extra.swap
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Runners have been failing to resolve every *.ubuntu.com name (azure.archive,
      # archive, security) while other hosts such as packages.microsoft.com resolve,
      # so apt -- and with it `playwright install --with-deps` -- failed every shard
      # before a test ran. Point apt at a mirror outside ubuntu.com instead: the
      # deb822 sources read /etc/apt/apt-mirrors.txt through their mirror+file: URIs,
      # and any source naming an ubuntu.com host directly is rewritten too. The
      # retry and timeout settings apply to every apt call, including Playwright's.
      - name: Use a non-ubuntu.com apt mirror
        run: |
          # Probe: one mirror is sometimes unreachable from a runner (kernel.org timed
          # out on every connection on 2026-11-12), so use the first that answers.
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          mirror=
          for m in https://mirrors.edge.kernel.org/ubuntu/ https://azure.archive.ubuntu.com/ubuntu/ https://archive.ubuntu.com/ubuntu/ https://mirror.us.leaseweb.net/ubuntu/ https://mirrors.xtom.com/ubuntu/; do
            if curl -4 -fsS --max-time 8 -o /dev/null "${m}dists/${codename}/InRelease"; then mirror=$m; break; fi
            echo "::warning::apt mirror unreachable: $m"
          done
          [ -n "$mirror" ] || { echo "::error::no apt mirror reachable"; exit 1; }
          echo "using apt mirror $mirror"
          echo "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -E -i "s#https?://([a-z0-9-]+\.)*(archive|security)\.ubuntu\.com/ubuntu/?#$mirror#g" {} +
          # IPv4 only: runners have also failed to connect to the mirror over IPv6.
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::ForceIPv4 "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-mirror >/dev/null
          grep -rhE '^(URIs|deb) ' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true
      # Two attempts, so a runner that cannot reach the mirror at all fails fast.
      - name: Install Chromium and its system packages
        run: |
          for attempt in 1 2; do
            pnpm --filter @patch/web exec playwright install --with-deps chromium && exit 0
            [ "$attempt" = 2 ] && break
            wait=$((30 + RANDOM % 31))
            echo "::warning::playwright install: attempt $attempt failed; retrying in ${wait}s"
            sleep "$wait"
          done
          echo "::error::playwright install: failed after 2 attempts"
          exit 1
      # The host's browser tests drive a headed Chromium on Xvfb, and its Codex
      # tests keep credentials in the native keyring (Secret Service over D-Bus).
      - name: Install Xvfb and the keyring
        run: |
          for attempt in 1 2; do
            sudo apt-get install -y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
              xvfb x11-utils gnome-keyring libsecret-tools dbus-x11 && exit 0
            [ "$attempt" = 2 ] && break
            wait=$((30 + RANDOM % 31))
            echo "::warning::apt-get install: attempt $attempt failed; retrying in ${wait}s"
            sleep "$wait"
          done
          echo "::error::apt-get install: failed after 2 attempts"
          exit 1
      # Some suites run against built output (the server serves the web build).
      # Not the phone: its "build" is an Expo export + prebuild that rewrites android/.
      - run: pnpm turbo build --filter='!@patch/mobile' --output-logs=errors-only
      # The browser layer is on here. It is off by default on the dev box, which
      # is too small for it (verify.mjs explains); a runner is not.
      # 40 minutes: a shard normally takes 15-25, and one that hung for longer
      # held every later check behind it.
      # Samples every 5s so a 137 can be traced to a process: memory, the
      # biggest resident processes, and the job's cgroup limit and OOM counter
      # (a cgroup kill leaves nothing in `free`). The log is printed on failure.
      - name: Memory sampler
        run: |
          nohup bash -c 'while true; do echo "--- mem $(date +%T)"; free -m | sed -n 2,3p; for f in memory.max memory.peak memory.events; do echo "$f: $(tr "\n" " " < /sys/fs/cgroup/$f 2>/dev/null)"; done; ps -eo rss,comm,args --sort=-rss | head -6 | cut -c1-160; sleep 5; done' > /tmp/mem.log 2>&1 &
      # Names the sender of any SIGKILL, whatever it is: the kernel's own
      # signal_generate event, read from tracefs, records the sending task. The
      # kill trace below only sees Node senders; this sees pkill, the runner, the
      # kernel. Needs no install. Fails the step if tracefs is unavailable.
      - name: Signal tracer
        run: |
          T=/sys/kernel/tracing
          # tracefs is root-only (0700), so test through sudo, and only mount if it is not already.
          mountpoint -q "$T" || sudo mount -t tracefs nodev "$T"
          sudo test -d "$T/events/signal/signal_generate" || { echo "::error::no tracefs signal events"; exit 1; }
          echo 'sig == 9' | sudo tee "$T/events/signal/signal_generate/filter" >/dev/null
          echo 1 | sudo tee "$T/events/signal/signal_generate/enable" >/dev/null
          nohup sudo sh -c "cat $T/trace_pipe" > /tmp/sigtrace.log 2>&1 &
      - name: The gate
        timeout-minutes: 40
        env:
          PATCH_RUN_BROWSER_GATE: ${{ github.event_name == 'merge_group' && '1' || '0' }}
          PATCH_BROWSER_SHARD: ${{ matrix.shard }}
          # Logs who sends any SIGKILL or group kill (scripts/ci-killtrace.cjs).
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-killtrace.cjs
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            node scripts/verify.mjs
          '
      - name: Memory log and kernel OOM kills
        if: failure()
        run: |
          tail -n 120 /tmp/mem.log || true
          echo "--- kill trace"; tail -n 60 /tmp/killtrace.log || true
          echo "--- SIGKILLs, sender first (kernel signal_generate; comm-pid is the sender, comm= pid= the target)"; tail -n 80 /tmp/sigtrace.log || true
          echo "--- kernel"; (sudo dmesg || sudo journalctl -k --no-pager) 2>&1 | grep -i -E "out of memory|oom|killed process|cgroup" | tail -n 20 || true

  # The one check that branch protection and release.yml look at: green only
  # when every shard is. Reports on forks too, where verify is skipped, so it is
  # failed rather than absent there.
  tests:
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.verify.result }}" = success || { echo "verify: ${{ needs.verify.result }}" >&2; exit 1; }
