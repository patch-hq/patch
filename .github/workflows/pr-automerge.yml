# Turns on auto-merge for every PR from the repository owner's chats. GitHub
# then merges it, rebased onto main so history stays linear, the moment the
# required `tests` check is green; until then it waits.

name: pr-automerge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.repository == 'tomchambers2/patch' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      # No checkout: pull_request_target runs with write access, so it never
      # touches the PR's code.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --rebase --delete-branch "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY"
