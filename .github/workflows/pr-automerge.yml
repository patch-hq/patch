# Turns on auto-merge for every PR into main from the repository owner's chats
# (a PR stacked on another branch merges into that branch by hand). The merge
# queue then merges it, with the method the queue sets, the moment the required
# `tests` check is green; until then it waits. Branches are tidied by the
# repo's "delete branch on merge" setting.
#
# A PR the queue drops (failed check, conflict) loses auto-merge, so it is
# switched on again on every push, and a half-hourly sweep re-enables it on any
# open, non-draft, clean PR into main that has lost it.

name: pr-automerge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event_name == 'pull_request_target' && github.repository == 'patch-hq/patch' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # No checkout: pull_request_target runs with write access, so it never
      # touches the PR's code.
      # GitHub never queues a PR whose auto-merge was switched on by the
      # Actions bot, so this acts as Tom with a fine-grained PAT (this repo,
      # pull requests + contents write). It expires: the run then fails on
      # each new PR, visibly. Renew it in 1Password (Agents, patch-automerge-token)
      # and the AUTOMERGE_TOKEN repo secret.
      - env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: gh pr merge --auto "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY"

  sweep:
    if: github.event_name != 'pull_request_target' && github.repository == 'patch-hq/patch'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --limit 100 \
            --json number,isDraft,mergeStateStatus,autoMergeRequest,headRepositoryOwner \
            --jq '.[] | select(.isDraft == false and .mergeStateStatus == "CLEAN" and .autoMergeRequest == null) | .number' |
          while read -r n; do
            echo "re-enabling auto-merge on #$n"
            gh pr merge --auto "$n" --repo "$GITHUB_REPOSITORY"
          done
