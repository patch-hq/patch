# Turns on auto-merge for every PR from the repository owner's chats. The merge
# queue then merges it, with the method the queue sets, the moment the required
# `tests` check is green; until then it waits. Branches are tidied by the
# repo's "delete branch on merge" setting.

name: pr-automerge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.repository == 'patch-hq/patch' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      # No checkout: pull_request_target runs with write access, so it never
      # touches the PR's code.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY"
