# Turns on auto-merge for every PR into main from the repository owner's chats
# (a PR stacked on another branch merges into that branch by hand). GitHub then
# rebases it onto main the moment the required `tests` check is green; until
# then it waits. There is no merge queue: main itself is tested after the merge
# and gates the release (test.yml). Branches are tidied by the repo's "delete
# branch on merge" setting.
#
# Switching it on when it is already on does no harm, so every push re-arms the
# PR: a fix pushed by the agent chat that needs-attention.yml spawns merges
# without anyone touching it.

name: pr-automerge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.repository == 'patch-hq/patch' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # No checkout: pull_request_target runs with write access, so it never
      # touches the PR's code.
      # A merge made with the Actions bot's token triggers no workflows, so
      # main's tests and the release would never run: this acts as Tom with a
      # fine-grained PAT (this repo,
      # pull requests + contents write). It expires: the run then fails on
      # each new PR, visibly. Renew it in 1Password (Agents, patch-automerge-token)
      # and the AUTOMERGE_TOKEN repo secret.
      - env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: gh pr merge --auto --rebase "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY"
